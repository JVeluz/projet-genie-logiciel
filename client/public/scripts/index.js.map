export default "<hr class=\"opacity-0\">\r\n<div class=\"container\">\r\n    <form id=\"login-form\">\r\n        <div class=\"mb-3\">\r\n            <label class=\"form-label\">Adresse mail</label>\r\n            <input name=\"email\" type=\"email\" class=\"form-control\">\r\n            <div class=\"form-text\">Nous ne partagerons jamais votre email à qui que ce soit.</div>\r\n        </div>\r\n        <div class=\"mb-3\">\r\n            <label class=\"form-label\">Mot de passe</label>\r\n            <input name=\"password\" type=\"password\" class=\"form-control\">\r\n        </div>\r\n        <div class=\"mb-3 form-check\">\r\n            <input name=\"remember-check\" type=\"checkbox\" class=\"form-check-input\">\r\n            <label class=\"form-check-label\">Se souvenir de moi</label>\r\n        </div>\r\n        <button id=\"login-button\" class=\"btn btn-primary\">Connection</button>\r\n        <button id=\"register-button\" class=\"btn btn-secondary\">S'enregistrer</button>\r\n    </form>\r\n</div>";
