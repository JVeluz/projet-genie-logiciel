export default "<navbar-element></navbar-element>\r\n\r\n<div class=\"pt-4\"></div>\r\n\r\n<main class=\"container main-container d-flex align-items-center justify-content-center py-5\">\r\n    <div class=\"col-12 col-md-8 col-lg-5 col-xl-4\">\r\n        <div class=\"card shadow-lg border-0 rounded-3\">\r\n            <div class=\"card-body p-4 p-md-5\">\r\n\r\n                <h2 class=\"card-title text-center fw-bold text-primary mb-4\">Créer un compte</h2>\r\n\r\n                <form class=\"register-form\">\r\n                    <!-- Champ Nom -->\r\n                    <div class=\"form-floating mb-3\">\r\n                        <input type=\"text\" class=\"form-control\" name=\"username\" id=\"floatingName\"\r\n                            placeholder=\"Votre nom\" required>\r\n                        <label for=\"floatingName\">Votre Nom</label>\r\n                    </div>\r\n\r\n                    <!-- Champ Email -->\r\n                    <div class=\"form-floating mb-3\">\r\n                        <input type=\"email\" class=\"form-control\" name=\"email\" id=\"floatingEmail\"\r\n                            placeholder=\"votre.email@exemple.com\" required>\r\n                        <label for=\"floatingEmail\">Adresse Email</label>\r\n                    </div>\r\n\r\n                    <!-- Champ Mot de passe -->\r\n                    <div class=\"form-floating mb-3\">\r\n                        <input type=\"password\" class=\"form-control\" name=\"password\" id=\"floatingPassword\"\r\n                            placeholder=\"Mot de passe\" required>\r\n                        <label for=\"floatingPassword\">Mot de passe</label>\r\n                    </div>\r\n\r\n                    <!-- Bouton de Soumission -->\r\n                    <div class=\"d-grid mb-3\">\r\n                        <button class=\"btn btn-primary btn-lg fw-bold\" type=\"submit\">S'inscrire</button>\r\n                    </div>\r\n\r\n                    <!-- Lien vers la connexion -->\r\n                    <div class=\"text-center\">\r\n                        <small class=\"text-muted\">Déjà un compte ? <a href=\"/login\" class=\"fw-bold text-primary\">Se\r\n                                connecter</a></small>\r\n                    </div>\r\n                </form>\r\n\r\n            </div>\r\n        </div>\r\n    </div>\r\n</main>";
