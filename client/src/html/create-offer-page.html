<!-- La navbar est incluse ici (composant personnalisé) -->
<navbar-element></navbar-element>

<!-- Contenu Principal -->
<main class="container py-5">
    <!-- Passage à une structure en 2 colonnes avec espacement g-5 -->
    <div class="row g-5 justify-content-center">

        <!-- COLONNE 1: FORMULAIRE DE CRÉATION -->
        <div class="col-12 col-lg-7">

            <h2 class="text-center fw-bold text-primary mb-4">Créer une nouvelle annonce</h2>

            <!-- Carte principale contenant le formulaire -->
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">

                    <!-- Formulaire de création d'annonce -->
                    <form>

                        <!-- Champ Titre (ID ajouté) -->
                        <div class="mb-3">
                            <label for="create-title" class="form-label fw-bold">Titre de l'annonce</label>
                            <input type="text" class="form-control" placeholder="Ex: Tondeuse à gazon" required
                                id="create-title">
                        </div>

                        <div class="row">
                            <!-- Champ Catégorie (ID ajouté) -->
                            <div class="col-md-6 mb-3">
                                <label for="create-category" class="form-label fw-bold">Catégorie</label>
                                <select class="form-select" required id="create-category">
                                    <option value="" selected disabled>Choisir...</option>
                                    <option value="Jardinage">Jardinage</option>
                                    <option value="Informatique">Informatique</option>
                                    <option value="Bricolage">Bricolage</option>
                                    <option value="Services">Services</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                            <!-- Champ Type d'offre (ID ajouté) -->
                            <div class="col-md-6 mb-3">
                                <label for="create-type" class="form-label fw-bold">Type d'offre</label>
                                <select class="form-select" required id="create-type">
                                    <option value="" selected disabled>Choisir...</option>
                                    <option value="Prêt d'Objet">Prêt d'Objet</option>
                                    <option value="Offre de Compétence">Offre de Compétence</option>
                                </select>
                            </div>
                        </div>

                        <!-- Champ Description (ID ajouté) -->
                        <div class="mb-3">
                            <label for="create-description" class="form-label fw-bold">Description</label>
                            <textarea class="form-control" rows="5" placeholder="Décrivez ce que vous proposez..."
                                required id="create-description"></textarea>
                        </div>

                        <!-- Champ "En échange de..." (ID ajouté) -->
                        <div class="mb-3">
                            <label for="create-exchange" class="form-label fw-bold">Ce que vous recherchez en
                                échange</label>
                            <textarea class="form-control" rows="3" placeholder="Ex: Un cours de cuisine..." required
                                id="create-exchange"></textarea>
                        </div>

                        <!-- Champ Localisation (ID ajouté) -->
                        <div class="mb-3">
                            <label for="create-location" class="form-label fw-bold">Localisation</label>
                            <input type="text" class="form-control" placeholder="Ex: Pau, 64000" required
                                id="create-location">
                        </div>

                        <!-- Champ Images (ID ajouté) -->
                        <div class="mb-3">
                            <label for="create-images" class="form-label fw-bold">Ajouter des photos</label>
                            <input class="form-control" type="file" accept="image/*" id="create-images">
                            <div class="form-text">La première image sera utilisée pour l'aperçu.</div>
                        </div>

                        <hr class="my-4">

                        <!-- Boutons d'action -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/" class="btn btn-outline-secondary me-md-2">Annuler</a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-send-fill me-2"></i>Publier l'annonce
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div> <!-- Fin de la colonne formulaire -->

        <!-- COLONNE 2: APERÇU DE L'OFFRE -->
        <div class="col-12 col-lg-5">
            <div class="sticky-top" style="top: 5rem;">
                <h4 class="text-center text-primary mb-4">Aperçu de l'annonce</h4>

                <!-- Carte d'aperçu (style inspiré de la page de détail) -->
                <div class="card shadow-lg border-0">
                    <!-- Image d'aperçu (ID ajouté) -->
                    <img src="https://placehold.co/800x450/eee/ccc?text=Image+de+l'annonce" class="card-img-top"
                        alt="Aperçu" id="preview-card-image">

                    <div class="card-body p-4">
                        <!-- Titre (ID ajouté) -->
                        <h3 class="card-title fw-bolder" id="preview-title">Titre de votre annonce</h3>

                        <!-- Badges (ID ajoutés) -->
                        <div>
                            <span class="badge bg-primary text-uppercase me-2" id="preview-category">Catégorie</span>
                            <span class="badge bg-warning text-dark text-uppercase" id="preview-type">Type</span>
                        </div>

                        <hr>

                        <!-- Description (ID ajouté) -->
                        <p class="card-text text-muted" id="preview-description">Votre description apparaîtra ici...</p>

                        <h6 class="text-secondary mt-4">Échange souhaité :</h6>
                        <!-- Échange (ID ajouté) -->
                        <p class="card-text fst-italic" id="preview-exchange">Ce que vous recherchez en échange...</p>

                        <h6 class="text-secondary mt-4">Localisation :</h6>
                        <!-- Localisation (ID ajouté) -->
                        <p class="card-text fw-bold" id="preview-location">
                            <i class="bi bi-geo-alt-fill text-danger me-2"></i>Votre localisation...
                        </p>
                    </div>
                </div>
            </div>
        </div> <!-- Fin de la colonne aperçu -->
    </div>
</main>
