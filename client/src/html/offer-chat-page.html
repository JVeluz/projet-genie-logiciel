<!-- La navbar est incluse ici (composant personnalisé) -->
<navbar-element></navbar-element>

<!-- Contenu Principal -->
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">

            <!-- 1. CARTE CONTEXTUELLE DE L'OBJET (OfferCard simplifiée) -->
            <!-- C'est le rappel de l'objet dont parle le chat -->
            <div class="card shadow-sm mb-3">
                <div class="row g-0">
                    <offer-element>
                        <div class="col-md-3">
                            <img src="https://placehold.co/400x300/33A366/ffffff?text=Objet"
                                class="offer-picture img-fluid rounded-start w-100" alt="Objet du chat"
                                style="object-fit: cover; height: 100%;">
                        </div>
                        <div class="col-md-9">
                            <div class="card-body">
                                <h5 class="offer-title card-title text-primary fw-bold">
                                    ?
                                </h5>
                                <span class="offer-category badge bg-primary text-uppercase me-2">
                                    Jardinage
                                </span>
                                <span class="offer-type badge bg-warning text-dark text-uppercase">
                                    Prêt d'Objet
                                </span>
                            </div>
                        </div>
                    </offer-element>
                </div>
            </div>

            <!-- 2. FENÊTRE DE CHAT PRINCIPALE -->
            <div class="card shadow-lg border-0">
                <!-- En-tête de la conversation -->
                <div class="card-header border-bottom-0 p-3">
                    <user-element class="offer-seller">
                        <h5 class="user-name mb-0 fw-bold">
                            Conversation avec Alice Dubois
                        </h5>
                    </user-element>
                </div>

                <!-- Historique des messages (avec scroll) -->
                <div class="chat-box card-body p-4" style="height: 50vh; overflow-y: auto;">
                </div>

                <!-- Pied de carte (Zone de saisie) -->
                <div class="card-footer p-3 border-0">
                    <!-- Formulaire d'envoi de message -->
                    <form class="message-form">
                        <div class="input-group">
                            <input name="message" type="text" class="form-control"
                                placeholder="Écrivez votre message..." aria-label="Écrivez votre message" required>
                            <button class="btn btn-success" type="submit" aria-label="Envoyer">
                                <i class="bi bi-send-fill"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>
