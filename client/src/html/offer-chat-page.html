<navbar-element></navbar-element>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">

            <div class="card shadow-sm mb-3">
                <div class="row g-0">
                    <offer-element>
                        <div class="col-md-3">
                            <img src="https://placehold.co/600x400" class="offer-picture img-fluid rounded-start w-100"
                                alt="Objet" style="object-fit: cover; height: 100%; max-height: 150px;">
                        </div>
                        <div class="col-md-9">
                            <div class="card-body py-2">
                                <h5 class="offer-title card-title text-primary fw-bold mb-1"></h5>
                                <div class="mb-2">
                                    <span class="offer-category badge bg-secondary me-1"></span>
                                    <span class="offer-type badge bg-warning text-dark"></span>
                                </div>
                                <small class="offer-location text-muted"></small>
                            </div>
                        </div>
                    </offer-element>
                </div>
            </div>

            <div class="card shadow-lg border-0" style="min-height: 600px;">

                <div class="card-header border-bottom p-3">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                        <user-element class="chat-partner d-flex align-items-center text-decoration-none">
                            <div class="position-relative">
                                <a class="user-profile-link text-decoration-none" href="#">
                                    <img src="" class="user-avatar rounded-circle border" width="50" height="50">
                                </a>
                            </div>
                            <div class="ms-3">
                                <h6 class="user-name mb-0 fw-bold">...</h6>
                                <small class="user-rating text-muted"></small>
                            </div>
                        </user-element>

                        <div class="d-flex align-items-center gap-2">

                            <span class="exchange-status badge bg-light text-dark border p-2 me-2">
                                En discussion
                            </span>

                            <button class="btn-propose btn btn-outline-primary btn-sm d-none align-items-center gap-2">
                                <i class="bi bi-arrow-left-right"></i> Proposer un échange
                            </button>

                            <button class="btn-cancel btn btn-outline-secondary btn-sm d-none align-items-center gap-2">
                                <i class="bi bi-x-lg"></i> Annuler
                            </button>

                            <button class="btn-accept btn btn-success btn-sm d-none align-items-center gap-2">
                                <i class="bi bi-check-circle-fill"></i> Accepter
                            </button>

                            <button class="btn-refuse btn btn-danger btn-sm d-none align-items-center gap-2">
                                <i class="bi bi-x-circle-fill"></i> Refuser
                            </button>

                        </div>
                    </div>
                </div>

                <div class="chat-box card-body p-4" style="height: 50vh; overflow-y: auto;"></div>

                <div class="card-footer p-3 border-top">
                    <form class="message-form">
                        <div class="input-group">
                            <button class="btn border" type="button"><i class="bi bi-paperclip"></i></button>
                            <input name="message" type="text" class="form-control border-start-0"
                                placeholder="Écrivez votre message..." required>
                            <button class="btn btn-primary" type="submit"><i class="bi bi-send-fill"></i></button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>
