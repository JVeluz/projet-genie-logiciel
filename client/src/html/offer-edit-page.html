<!-- La navbar est incluse ici (composant personnalisé) -->
<navbar-element></navbar-element>

<!-- Contenu Principal -->
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <h2 class="text-center fw-bold text-primary mb-4">Modifier votre annonce</h2>

            <!-- Carte principale contenant le formulaire -->
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">

                    <form id="edit-offer-form">

                        <!-- Champ Titre -->
                        <div class="mb-3">
                            <label for="offer-title" class="form-label fw-bold">Titre de l'annonce</label>
                            <input type="text" class="form-control" id="offer-title"
                                value="Tondeuse à Gazon Thermique Puissante" required>
                        </div>

                        <!-- Ligne pour Catégorie et Type -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="offer-category" class="form-label fw-bold">Catégorie</label>
                                <select class="form-select" id="offer-category" required>
                                    <option value="jardinage" selected>Jardinage</option>
                                    <option value="bricolage">Bricolage</option>
                                    <option value="services">Services</option>
                                    <option value="maison">Maison</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="offer-type" class="form-label fw-bold">Type d'offre</label>
                                <select class="form-select" id="offer-type" required>
                                    <option value="objet" selected>Objet à Prêter</option>
                                    <option value="competence">Compétence</option>
                                </select>
                            </div>
                        </div>

                        <!-- Champ Description -->
                        <div class="mb-3">
                            <label for="offer-description" class="form-label fw-bold">Description</label>
                            <textarea class="form-control" id="offer-description" rows="4"
                                required>Tondeuse de marque XYZ, bien entretenue. Idéale pour les grandes surfaces...</textarea>
                        </div>

                        <!-- Champ "En échange de" -->
                        <div class="mb-3">
                            <label for="offer-ask" class="form-label fw-bold">Ce que vous demandez en échange</label>
                            <textarea class="form-control" id="offer-ask" rows="3"
                                required>Je souhaite l'échanger contre un cours d'initiation à la programmation...</textarea>
                        </div>

                        <!-- Champ Localisation -->
                        <div class="mb-3">
                            <label for="offer-location" class="form-label fw-bold">Localisation</label>
                            <input type="text" class="form-control" id="offer-location" value="Pau" required>
                        </div>

                        <!-- Champ Gestion des Images -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Images actuelles</label>
                            <!-- Simulation des images existantes -->
                            <div>
                                <img src="https://placehold.co/100x75/33A366/ffffff?text=Img+1"
                                    class="img-thumbnail me-2" alt="Image 1">
                                <img src="https://placehold.co/100x75/33A366/ffffff?text=Img+2" class="img-thumbnail"
                                    alt="Image 2">
                            </div>
                            <label for="offer-images" class="form-label mt-3">Ajouter ou remplacer des images</label>
                            <input class="form-control" type="file" id="offer-images" multiple>
                        </div>

                        <hr class="my-4">

                        <!-- Boutons d'action -->
                        <div class="d-flex flex-wrap justify-content-between align-items-center">
                            <!-- Bouton Enregistrer -->
                            <button type="submit" class="btn btn-primary btn-lg mb-2">
                                <i class="bi bi-check-circle me-2"></i>Enregistrer
                            </button>

                            <!-- Bouton Annuler -->
                            <a href="/profile" class="btn btn-outline-secondary mb-2">
                                Annuler
                            </a>

                            <!-- Bouton Supprimer (ouvre le modal) -->
                            <button type="button" class="btn btn-outline-danger mb-2" data-bs-toggle="modal"
                                data-bs-target="#deleteModal">
                                <i class="bi bi-trash me-2"></i>Supprimer l'annonce
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
