<hr class="opacity-0">
<div class="container">
    <form id="login-form">
        <div class="mb-3">
            <label class="form-label">Adresse mail</label>
            <input name="email" type="email" class="form-control">
            <div class="form-text">Nous ne partagerons jamais votre email à qui que ce soit.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input name="password" type="password" class="form-control">
        </div>
        <div class="mb-3 form-check">
            <input name="remember-check" type="checkbox" class="form-check-input">
            <label class="form-check-label">Se souvenir de moi</label>
        </div>
        <button id="login-button" class="btn btn-primary">Connection</button>
        <button id="register-button" class="btn btn-secondary">S'enregistrer</button>
    </form>
</div>
