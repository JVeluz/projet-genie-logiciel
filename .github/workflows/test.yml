name: CI de Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install and Test Backend
      run: |
        cd server
        echo "JWT_SECRET=secret_bidon_pour_les_tests" > .env  # Crée un faux fichier .env
        echo "PORT=3000" >> .env                             # Ajoute une variable au cas où
        npm install
        npm test